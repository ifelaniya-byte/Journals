# Ω-ABSOLUTE Foundation Configuration
# This file contains configuration parameters for the foundation layer

resources:
  max_tokens_per_task: 1000000
  max_wall_time_seconds: 3600
  max_tool_calls: 500
  max_memory_mb: 8192
  max_recursive_critique_depth: 5

logging:
  enabled: true
  min_level: INFO
  log_dir: null
  console_output: true
  file_output: false
  max_entries: 10000

telemetry:
  enabled: true
  event_buffer_size: 1000
  resource_tracking: true
  performance_tracking: false

governance:
  strict_claim_discipline: true
  audit_log_enabled: true
  change_control_required: true
  rollback_retention_days: 30